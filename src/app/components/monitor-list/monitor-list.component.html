<app-page-header title="Monitor List" [io]="service"></app-page-header>

<ng-container *ngIf="view$ | async as view">
  <p class="text-muted">
    Select which servers from the pool are actively monitored ({{ view.selectedCount }} selected).
  </p>

  <div *ngIf="view.orphans.length" class="alert alert-warning">
    These hostnames are in the list but not in the servers pool (ignored by the monitor):
    {{ view.orphans.join(', ') }}
  </div>

  <ng-container *ngIf="view.rows.length; else emptyPool">
    <div class="d-flex gap-2 mb-3">
      <button
        type="button"
        class="btn btn-sm btn-outline-primary"
        [disabled]="view.allChecked && !view.orphans.length"
        (click)="service.selectAll(view.hostnames)"
      >
        <i class="bi bi-check-all me-1"></i>Select all
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [disabled]="!view.selectedCount"
        (click)="service.clear()"
      >
        <i class="bi bi-eraser me-1"></i>Clear all
      </button>
    </div>

    <ul class="list-group mb-3">
      <li class="list-group-item" *ngFor="let row of view.rows">
        <div class="form-check mb-0">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="'srv-' + row.hostname"
            [checked]="row.checked"
            (change)="toggle(row.hostname, $event)"
          />
          <label class="form-check-label" [for]="'srv-' + row.hostname">{{ row.hostname }}</label>
        </div>
      </li>
    </ul>
  </ng-container>

  <ng-template #emptyPool>
    <p class="text-muted">No servers in the pool. Add servers in the Servers tab first.</p>
  </ng-template>
</ng-container>
