<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Client Availability Monitor</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/monitor-config" routerLinkActive="active">
            Monitor Config
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/users-info" routerLinkActive="active">Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/servers-pool" routerLinkActive="active">Servers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/monitor-list" routerLinkActive="active">Monitor List</a>
        </li>
      </ul>
      <div class="d-flex gap-2">
        <label class="btn btn-outline-light btn-sm mb-0">
          Import
          <input type="file" multiple accept=".json,.txt" (change)="import($event)" hidden />
        </label>
        <button type="button" class="btn btn-light btn-sm" (click)="exportAll()">Export all</button>
      </div>
    </div>
  </div>
</nav>

<div *ngIf="message" class="container mt-3">
  <div class="alert alert-dismissible mb-0" [ngClass]="'alert-' + message.type" role="alert">
    <div *ngFor="let line of message.lines">{{ line }}</div>
    <button type="button" class="btn-close" (click)="dismiss()" aria-label="Close"></button>
  </div>
</div>
