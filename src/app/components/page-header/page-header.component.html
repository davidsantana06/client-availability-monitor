<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ title }}</h1>
  <div class="d-flex gap-2">
    <label class="btn btn-outline-secondary mb-0" [appTooltip]="importTooltip">
      Import
      <input type="file" [accept]="accept" (change)="import($event)" hidden />
    </label>
    <button
      type="button"
      class="btn btn-outline-primary"
      [appTooltip]="exportTooltip"
      (click)="export()"
    >
      Export
    </button>
  </div>
</div>

<div *ngIf="message" class="alert alert-dismissible" [ngClass]="'alert-' + message.type" role="alert">
  <div *ngFor="let line of message.lines">{{ line }}</div>
  <button type="button" class="btn-close" (click)="dismiss()" aria-label="Close"></button>
</div>
