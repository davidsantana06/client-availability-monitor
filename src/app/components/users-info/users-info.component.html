<app-page-header title="Users" [io]="service" (imported)="cancel()"></app-page-header>

<div class="card mb-4">
  <div class="card-header">{{ isEditing ? 'Edit user' : 'Add user' }}</div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="u-username">Username</label>
          <input
            id="u-username"
            type="text"
            class="form-control"
            formControlName="username"
            [attr.maxlength]="limits.usernameMaxLength"
            [class.is-invalid]="hasError(form,'username')"
          />
          <div class="invalid-feedback">Username is required.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="u-email">Email</label>
          <input
            id="u-email"
            type="email"
            class="form-control"
            formControlName="email"
            [attr.maxlength]="limits.emailMaxLength"
            [class.is-invalid]="hasError(form,'email')"
          />
          <div class="invalid-feedback">
            <span
              *ngIf="
                form.get('email')?.hasError('required') ||
                form.get('email')?.hasError('email')
              "
            >
              Enter a valid e-mail address.
            </span>
            <span *ngIf="form.get('email')?.hasError('notUnique')">
              This e-mail is already in use.
            </span>
          </div>
        </div>
      </div>
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
          <i
            class="bi me-2"
            [ngClass]="isEditing ? 'bi-check-lg' : 'bi-plus-lg'"
            aria-hidden="true"
          ></i>
          {{ isEditing ? 'Update' : 'Add' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="reset()">
          <i class="bi bi-arrow-counterclockwise me-2" aria-hidden="true"></i>Reset
        </button>
        <button
          *ngIf="isEditing"
          type="button"
          class="btn btn-secondary"
          (click)="cancel()"
        >
          <i class="bi bi-x-lg me-2" aria-hidden="true"></i>Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-striped align-middle text-nowrap">
    <thead>
      <tr>
        <th scope="col">Username</th>
        <th scope="col">Email</th>
        <th scope="col" class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody *ngIf="service.value$ | async as list">
      <tr *ngFor="let user of list; let i = index">
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-primary me-2" (click)="edit(i)">
            <i class="bi bi-pencil me-1" aria-hidden="true"></i>Edit
          </button>
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(i)">
            <i class="bi bi-trash me-1" aria-hidden="true"></i>Remove
          </button>
        </td>
      </tr>
      <tr *ngIf="list.length === 0">
        <td colspan="3" class="text-center text-muted">No users yet.</td>
      </tr>
    </tbody>
  </table>
</div>

<app-confirm-dialog
  [request]="removalRequest"
  (confirmed)="confirmRemoval()"
  (cancelled)="cancelRemoval()"
></app-confirm-dialog>
